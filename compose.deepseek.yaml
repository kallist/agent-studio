services:
  secret-init:
    environment:
      PROVIDER_SECRET_DIRECTORY: /run/agent-studio-provider-secrets
    volumes:
      - provider_secrets:/run/agent-studio-provider-secrets

  api:
    environment:
      DEEPSEEK_API_KEY_FILE: /run/agent-studio-provider-secrets/deepseek_api_key
      LLM_PROVIDER: deepseek
      REQUIRE_LLM_PROVIDER_CONFIGURED: "1"
    volumes:
      - provider_secrets:/run/agent-studio-provider-secrets:ro

volumes:
  provider_secrets:
