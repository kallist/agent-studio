name: Real Provider Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  provider-live:
    name: Real DeepSeek
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: provider-live-validation
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_REAL_TEST_MODEL: deepseek-v4-flash
      OPENAI_API_KEY: ""
      RUN_REAL_DEEPSEEK_TESTS: "1"
      RUN_REAL_OPENAI_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Require the protected DeepSeek secret
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured in provider-live-validation." >&2
            exit 1
          fi
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e './apps/api[dev]'
      - name: Explicit billable DeepSeek validation
        run: .venv/bin/pytest apps/api/tests/real_deepseek -m real_deepseek -q
      - name: Provider summary
        if: always()
        run: |
          echo "### Real DeepSeek" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual protected-environment validation only; never a pull-request or main merge gate." >> "$GITHUB_STEP_SUMMARY"
